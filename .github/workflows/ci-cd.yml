name: CI/CD Pipeline

on:
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main

jobs:
  lint-and-check:
    name: Lint and Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Optional: Add TypeScript checking if needed
      # - name: Type Check
      #   run: npx tsc --noEmit

  build-and-push:
    name: Build & Push Docker Image
    needs: lint-and-check
    runs-on: ubuntu-latest
    # We only build and push when code is merged/pushed directly to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # These secrets in GitHub Repository settings
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Make sure to change 'beats-music' if you want a different repository name on Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/beat-music:latest
          # Using cache to make subsequent builds faster!
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/beat-music:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/beat-music:buildcache,mode=max

  deploy:
    name: Trigger Render Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render
        # You need to grab the "Deploy Hook" URL from your Render Dashboard
        # and save it as a GitHub Secret called RENDER_DEPLOY_HOOK
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Deployment Triggered!"
          else
            echo "No Render Deploy Hook URL found in GitHub secrets. Skipping."
          fi
